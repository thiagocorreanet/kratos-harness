name: Compatibility gate

on:
  pull_request:
    branches: [developer, main]
  push:
    branches: [developer, main]
  schedule:
    - cron: "7 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts-and-hosts:
    name: Oracle, differential, and host fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # `actions/setup-node` installs whatever npm the chosen Node.js
      # distribution bundles, and that pairing drifts as the runner image is
      # rebuilt. The lockfile is resolved by the npm `package.json` pins, not
      # by whichever one the image shipped with.
      - name: Pin the exact npm release
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(node -p 'require("./package.json").packageManager.split("@")[1]')"
          npm install --global --no-audit --no-fund "npm@$pinned"
          test "$(npm --version)" = "$pinned"
      - run: npm ci
      - run: npm run oracle:verify
      - run: npm run parity:check
      - run: npm run differential:check
      - name: Exercise deterministic host contracts
        run: >-
          npm test -- --run
          tests/host-adapter-contract.test.ts
          tests/host-negotiation.test.ts
          tests/host-operation-message.test.ts
          tests/plugin-install.test.ts
      - run: npm run build
      - run: npm run package:verify
