name: CI

on:
  pull_request:
    branches:
      - developer
      - main
  push:
    branches:
      - developer
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Node quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false

      - name: Prepare diagnostics
        run: mkdir -p .ci-diagnostics

      - name: Verify exact toolchain
        run: |
          set -euo pipefail
          {
            node_version="$(node --version)"
            npm_version="$(npm --version)"
            printf '%s\n' "$node_version"
            printf '%s\n' "$npm_version"
            test "$node_version" = "v24.18.0"
            test "$npm_version" = "11.16.0"
          } 2>&1 | tee .ci-diagnostics/toolchain.log

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee .ci-diagnostics/install.log

      - name: Check formatting
        run: |
          set -euo pipefail
          npm run format:check 2>&1 | tee .ci-diagnostics/format.log

      - name: Check spelling
        run: |
          set -euo pipefail
          npm run spellcheck 2>&1 | tee .ci-diagnostics/spelling.log

      - name: Enforce English-only source prose
        run: |
          set -euo pipefail
          npm run english:check 2>&1 | tee .ci-diagnostics/english.log

      - name: Lint
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee .ci-diagnostics/lint.log

      - name: Type-check
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee .ci-diagnostics/type-check.log

      - name: Run unit tests
        run: |
          set -euo pipefail
          npm test 2>&1 | tee .ci-diagnostics/unit-tests.log

      - name: Run coverage tests
        run: |
          set -euo pipefail
          npm run test:coverage 2>&1 | tee .ci-diagnostics/coverage.log

      - name: Check performance budgets
        run: |
          set -euo pipefail
          npm run performance:check 2>&1 | tee .ci-diagnostics/performance.log

      - name: Run mutation sentinels
        run: |
          set -euo pipefail
          npm run mutation:check 2>&1 | tee .ci-diagnostics/mutation.log

      - name: Validate GitHub template schemas
        run: |
          set -euo pipefail
          npm run templates:validate 2>&1 | tee .ci-diagnostics/templates.log

      - name: Run differential self-tests
        run: |
          set -euo pipefail
          npm run differential:check 2>&1 | tee .ci-diagnostics/differential.log

      - name: Build bundle
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee .ci-diagnostics/build.log

      - name: Verify package contents
        run: |
          set -euo pipefail
          npm run package:verify 2>&1 | tee .ci-diagnostics/package.log

      - name: Upload failure diagnostics
        if: ${{ failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-diagnostics/
            coverage/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6
          include-hidden-files: true

  dco:
    name: DCO sign-off
    # Only a pull request has a base and a head to compare. A push to a
    # protected branch arrives already reviewed, and its range would be the
    # merged history rather than the contribution.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default shallow fetch cannot walk base..head.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false

      - name: Require a Developer Certificate of Origin sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/check-dco.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
